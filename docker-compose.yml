version: '3.8'

services:
  servidor:
    build: .
    container_name: chat-servidor
    ports:
      - "8080:8080"
    networks:
      - chat-network
    command: python servidor.py
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  cliente-gerente:
    build: .
    container_name: chat-cliente-gerente
    networks:
      - chat-network
    command: tail -f /dev/null  # Mantiene el contenedor vivo
    tty: true
    stdin_open: true
    depends_on:
      - servidor
    restart: unless-stopped

  cliente-subgerente:
    build: .
    container_name: chat-cliente-subgerente
    networks:
      - chat-network
    command: tail -f /dev/null
    tty: true
    stdin_open: true
    depends_on:
      - servidor
    restart: unless-stopped

networks:
  chat-network:
    driver: bridge